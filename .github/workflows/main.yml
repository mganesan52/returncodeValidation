name: Python Test Pipeline

on: [push, pull_request] # Runs the test on every push or PR

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Lint YAML files
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: src

      - name: Run Tests
        id: run_tests
        continue-on-error: true
        run: |
          export PYTHONPATH=$PYTHONPATH:${{ github.workspace }}/src
          pytest --tb=short . 2>&1 | tee full_output.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo \"TEST_FAILURE_SUMMARY<<EOF\" >> $GITHUB_ENV
          tail -n 20 full_output.log >> $GITHUB_ENV
          echo \"EOF\" >> $GITHUB_ENV
          echo \"PYTEST_EXIT_CODE=$EXIT_CODE\" >> $GITHUB_ENV
          exit $EXIT_CODE
        working-directory: tests
      
      - name: Create Incident on Failure
        if: failure()
        env:
          INCIDENT_PASS: ${{ secrets.snow_pass }}
        run: |
          echo "Creating incident for failed task: ${{ github.job }}"
          curl --request POST \
            --url "https://dev273137.service-now.com/api/now/table/incident" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --user "admin:$INCIDENT_PASS" \
            --data "{
              \"description\": \"Pipeline failure details: ${{ env.TEST_FAILURE_SUMMARY }}\",
              \"assignment_group\": \"2dfcd6af83f73610d05fc4b6feaad3f4\",
              \"caller_id\": \"858c1a6f83f73610d05fc4b6feaad3cd\",
              \"short_description\": \"Failure in ${{ github.repository }} - Job: ${{ github.job }}\",
              \"urgency\": \"2\",
              \"impact\": \"2\",
              \"work_notes\": \"Workflow URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
            }"
