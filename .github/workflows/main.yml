name: Python Test Pipeline

on: [push, pull_request] # Runs the test on every push or PR

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Lint YAML files
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: src

      - name: Run Tests
        run: |
          export PYTHONPATH=$PYTHONPATH:${{ github.workspace }}/src
          pytestot
        working-directory: tests

  
      
      - name: Create Incident on Failure
        if: failure()
        run: |
          echo "Creating incident for failed task: ${{ github.job }}"

          curl "https://dev273137.service-now.com/api/now/table/incident" \
            --request POST \
            --header "Accept:application/json" \
            --header "Content-Type:application/json" \
            --data "{\"short_description\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"urgency\":\"2\",\"impact\":\"2\"}" \
            --user 'admin':'0-xcVC1^qRPs'
