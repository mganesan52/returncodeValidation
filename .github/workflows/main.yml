name: Python Test Pipeline

on: [push, pull_request] # Runs the test on every push or PR

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Lint YAML files
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: src

      - name: Run Tests
        run: |
          export PYTHONPATH=$PYTHONPATH:${{ github.workspace }}/src
          pytestot
        working-directory: tests
      
      - name: Run Tests
        id: run_tests
        continue-on-error: true
        run: |
          export PYTHONPATH=$PYTHONPATH:${{ github.workspace }}/src
          TEST_LOG=$(pytest --tb=short tests 2>&1)
          EXIT_CODE=$?

          echo "TEST_FAILURE_SUMMARY<<EOF" >> $GITHUB_ENV
          echo "$TEST_LOG" | tail -n 20 >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          
          # Exit with the original pytest code so the job status is correct
          exit $EXIT_CODE

      - name: Create Incident
        if: steps.run_tests.outcome == 'failure'
        run: |
          echo "Incident for Task: ${{ github.job }}"
          echo "Failure Details from Variable:"
          echo "$TEST_FAILURE_SUMMARY"
          curl "https://dev273137.service-now.com/api/now/table/incident" \
            --request POST \
            --header "Accept:application/json" \
            --header "Content-Type:application/json" \
            --data "{'short_description':"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",'urgency':'2','impact':'2'}" \
            --user 'admin':'0-xcVC1^qRPs'